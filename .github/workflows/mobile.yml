# App móvil (carpeta mobile/): pruebas, APK de Android e .ipa de iOS.
#
# Solo corre cuando cambia algo de mobile/ (o este archivo), así los cambios
# del backend, cron o frontend no disparan compilaciones. También se puede
# lanzar a mano desde la pestaña Actions ("Run workflow").
#
# El .ipa sale SIN FIRMAR (no hay cuenta de Apple Developer en el repo). Para
# instalarlo en el iPhone se firma con tu Apple ID usando Sideloadly o AltStore.
name: Mobile (Flutter) · IPA y APK

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile.yml'
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: mobile

env:
  FLUTTER_VERSION: '3.44.1'

jobs:
  test:
    name: Pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    name: APK Android
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Configuración de Firebase (push)
        env:
          FIREBASE_DART_DEFINES: ${{ secrets.FIREBASE_DART_DEFINES }}
        run: |
          if [ -n "$FIREBASE_DART_DEFINES" ]; then
            printf '%s' "$FIREBASE_DART_DEFINES" > firebase.json
            # Un valor mal copiado cierra la app en iOS al abrirla: se valida
            # aquí y se dice exactamente cuál está mal.
            python3 ../.github/scripts/validar_firebase.py firebase.json
            echo "DEFINES=--dart-define-from-file=firebase.json" >> "$GITHUB_ENV"
            echo "Push del servidor activado para este build."
          else
            echo "::notice::Sin el secreto FIREBASE_DART_DEFINES: el build sale sin push (usa avisos locales + refresco en segundo plano)."
          fi
      - run: flutter build apk --release $DEFINES
      - uses: actions/upload-artifact@v4
        with:
          name: Agendaservi-android-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  ios:
    name: IPA iOS (sin firmar)
    needs: test
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Configuración de Firebase (push)
        env:
          FIREBASE_DART_DEFINES: ${{ secrets.FIREBASE_DART_DEFINES }}
        run: |
          if [ -n "$FIREBASE_DART_DEFINES" ]; then
            printf '%s' "$FIREBASE_DART_DEFINES" > firebase.json
            # Un valor mal copiado cierra la app en iOS al abrirla: se valida
            # aquí y se dice exactamente cuál está mal.
            python3 ../.github/scripts/validar_firebase.py firebase.json
            echo "DEFINES=--dart-define-from-file=firebase.json" >> "$GITHUB_ENV"
            echo "Push del servidor activado para este build."
          else
            echo "::notice::Sin el secreto FIREBASE_DART_DEFINES: el build sale sin push (usa avisos locales + refresco en segundo plano)."
          fi
      - name: Build iOS (sin firma)
        run: flutter build ios --release --no-codesign $DEFINES
      # `--no-codesign` deja el .app listo; el .ipa es ese .app dentro de una
      # carpeta Payload comprimida en zip.
      - name: Empaquetar IPA
        run: |
          mkdir -p build/ios/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -qry Agendaservi-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Agendaservi-unsigned-ipa
          path: mobile/build/ios/ipa/Agendaservi-unsigned.ipa
          retention-days: 30
      # Además del artefacto, se publica como release para descargarlo sin
      # entrar al detalle de la ejecución.
      - name: Publicar release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mobile-build-${{ github.run_number }}
          name: Agendaservi móvil · build ${{ github.run_number }}
          body: |
            Compilado automáticamente desde `${{ github.sha }}`.
            **iOS:** `.ipa` sin firmar. Instálalo firmándolo con tu Apple ID desde Sideloadly o AltStore.
            **Android:** el APK está en los artefactos de la ejecución.
          files: mobile/build/ios/ipa/Agendaservi-unsigned.ipa
