# App móvil (carpeta mobile/): pruebas, APK de Android e .ipa de iOS.
#
# Solo corre cuando cambia algo de mobile/ (o este archivo), así los cambios
# del backend, cron o frontend no disparan compilaciones. También se puede
# lanzar a mano desde la pestaña Actions ("Run workflow").
#
# El .ipa sale SIN FIRMAR (no hay cuenta de Apple Developer en el repo). Para
# instalarlo en el iPhone se firma con tu Apple ID usando Sideloadly o AltStore.
name: Mobile (Flutter) · IPA y APK

on:
  push:
    branches: [main, 'feature/**']
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile.yml'
  workflow_dispatch:

permissions:
  contents: write
  # Para borrar artefactos viejos (el espacio gratuito de Actions es limitado).
  actions: write

defaults:
  run:
    working-directory: mobile

env:
  FLUTTER_VERSION: '3.44.1'

jobs:
  # Cada .ipa/APK pesa decenas de MB y el espacio de artefactos de Actions se
  # llena ("Artifact storage quota has been hit"). Se borran los anteriores:
  # los builds quedan para siempre en Releases, que no cuentan para ese límite.
  limpiar:
    name: Limpiar artefactos viejos
    # Si no se puede limpiar, los builds siguen igual.
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const artefactos = await github.paginate(github.rest.actions.listArtifactsForRepo, {
              owner: context.repo.owner, repo: context.repo.repo, per_page: 100,
            });
            let borrados = 0;
            for (const a of artefactos) {
              if (a.workflow_run?.id === context.runId) continue;
              await github.rest.actions.deleteArtifact({ owner: context.repo.owner, repo: context.repo.repo, artifact_id: a.id });
              borrados++;
            }
            core.notice(`Artefactos viejos borrados: ${borrados}`);

  test:
    name: Pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    name: APK Android
    needs: [test, limpiar]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Configuración de Firebase (push)
        env:
          FIREBASE_DART_DEFINES: ${{ secrets.FIREBASE_DART_DEFINES }}
        run: |
          if [ -n "$FIREBASE_DART_DEFINES" ]; then
            printf '%s' "$FIREBASE_DART_DEFINES" > firebase.json
            # Un valor mal copiado cierra la app en iOS al abrirla: se valida
            # aquí y se dice exactamente cuál está mal.
            python3 ../.github/scripts/validar_firebase.py firebase.json
            echo "DEFINES=--dart-define-from-file=firebase.json" >> "$GITHUB_ENV"
            echo "Push del servidor activado para este build."
          else
            echo "::notice::Sin el secreto FIREBASE_DART_DEFINES: el build sale sin push (usa avisos locales + refresco en segundo plano)."
          fi
      - run: flutter build apk --release $DEFINES
      - run: cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/Agendaservi.apk
      - uses: actions/upload-artifact@v4
        # Si el espacio de artefactos está lleno, el APK igual queda en Releases.
        continue-on-error: true
        with:
          name: Agendaservi-android-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 3
      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mobile-build-${{ github.run_number }}
          name: Agendaservi móvil · build ${{ github.run_number }} (${{ github.ref_name }})
          prerelease: ${{ github.ref != 'refs/heads/main' }}
          make_latest: ${{ github.ref == 'refs/heads/main' }}
          body: |
            Compilado automáticamente desde `${{ github.sha }}` (rama `${{ github.ref_name }}`).
            **Android:** `Agendaservi.apk`.
            **iOS:** `.ipa` sin firmar. Instálalo firmándolo con tu Apple ID desde Sideloadly o AltStore.
          files: mobile/build/app/outputs/flutter-apk/Agendaservi.apk

  ios:
    name: IPA iOS (sin firmar)
    needs: [test, limpiar]
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Configuración de Firebase (push)
        env:
          FIREBASE_DART_DEFINES: ${{ secrets.FIREBASE_DART_DEFINES }}
        run: |
          if [ -n "$FIREBASE_DART_DEFINES" ]; then
            printf '%s' "$FIREBASE_DART_DEFINES" > firebase.json
            # Un valor mal copiado cierra la app en iOS al abrirla: se valida
            # aquí y se dice exactamente cuál está mal.
            python3 ../.github/scripts/validar_firebase.py firebase.json
            echo "DEFINES=--dart-define-from-file=firebase.json" >> "$GITHUB_ENV"
            echo "Push del servidor activado para este build."
          else
            echo "::notice::Sin el secreto FIREBASE_DART_DEFINES: el build sale sin push (usa avisos locales + refresco en segundo plano)."
          fi
      - name: Build iOS (sin firma)
        run: flutter build ios --release --no-codesign $DEFINES
      # `--no-codesign` deja el .app listo; el .ipa es ese .app dentro de una
      # carpeta Payload comprimida en zip.
      - name: Empaquetar IPA
        run: |
          mkdir -p build/ios/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -qry Agendaservi-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        # Si el espacio de artefactos está lleno, el .ipa igual queda en Releases.
        continue-on-error: true
        with:
          name: Agendaservi-unsigned-ipa
          path: mobile/build/ios/ipa/Agendaservi-unsigned.ipa
          retention-days: 3
      # Se publica en Releases (de todas las ramas; las que no son main como
      # versión previa): se descarga sin entrar al detalle de la ejecución y no
      # ocupa el espacio de artefactos.
      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mobile-build-${{ github.run_number }}
          name: Agendaservi móvil · build ${{ github.run_number }} (${{ github.ref_name }})
          prerelease: ${{ github.ref != 'refs/heads/main' }}
          make_latest: ${{ github.ref == 'refs/heads/main' }}
          body: |
            Compilado automáticamente desde `${{ github.sha }}` (rama `${{ github.ref_name }}`).
            **Android:** `Agendaservi.apk`.
            **iOS:** `.ipa` sin firmar. Instálalo firmándolo con tu Apple ID desde Sideloadly o AltStore.
          files: mobile/build/ios/ipa/Agendaservi-unsigned.ipa
